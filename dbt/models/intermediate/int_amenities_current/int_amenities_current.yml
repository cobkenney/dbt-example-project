version: 2

models:
  - name: int_amenities_current
    description: >
      One row per listing holding its CURRENT amenity set — the changelog's
      latest event per listing, flattened from a JSON array and pivoted into
      boolean flags. This is a deliberate grain reduction, not a history model.
      The changelog does hold real history (2 events per listing, 48 of 50 with
      differing amenity sets), but every event predates the calendar window, so
      a point-in-time join provably changes nothing — see
      tests/assert_amenities_predate_calendar.sql, which fails if that stops
      being true. Built from the changelog rather than stg_listings so that
      listing 276450 — present in the calendar but absent from listings — still
      gets amenity flags.


      The boolean flags are generated by a Jinja loop over the distinct amenity
      names in the source, not hardcoded, so all 81 amenities get a flag. Only
      the flags consumed downstream are documented individually below; the rest
      follow the same has_<slugified_amenity_name> pattern. Because the column
      list comes from the data, a new amenity upstream adds a column on the next
      run — select flags by name rather than `select *`.
    config:
      tags: ['1x_day']
    columns:
      - name: listing_id
        description: >
          {{ doc('listing_id') }}

          Primary key here, covering all 50 listings the calendar references —
          including 276450, which stg_listings lacks.
        data_tests:
          - unique
          - not_null

      - name: amenity_count
        description: "{{ doc('amenity_count') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

      - name: amenity_list
        description: >
          Array of all distinct amenity names for the listing. Every amenity now
          has a generated boolean flag, so this is redundant for filtering — it
          is kept because it survives the addition of new amenity names without
          a schema change.

      - name: has_air_conditioning
        description: "{{ doc('has_air_conditioning') }}"
        data_tests:
          - not_null

      - name: has_lockbox
        description: "{{ doc('has_lockbox') }}"
        data_tests:
          - not_null

      - name: has_first_aid_kit
        description: "{{ doc('has_first_aid_kit') }}"
        data_tests:
          - not_null

      - name: has_wifi
        description: "{{ doc('has_wifi') }}"

      - name: has_heating
        description: "{{ doc('has_heating') }}"

      - name: has_kitchen
        description: "{{ doc('has_kitchen') }}"

      - name: has_65_inch_hdtv_with_netflix_hbo_max_amazon_prime_video_standard_cable
        description: >
          Whether the listing offers "65 inch HDTV with Netflix, HBO Max, Amazon Prime Video, standard cable".
          Generated flag — exact match on that amenity name.

      - name: has_bbq_grill
        description: >
          Whether the listing offers "BBQ grill".
          Generated flag — exact match on that amenity name.

