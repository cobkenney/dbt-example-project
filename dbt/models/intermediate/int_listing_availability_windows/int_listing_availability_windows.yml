version: 2

models:
  - name: int_listing_availability_windows
    description: >
      One row per contiguous window of available dates per listing, with the
      longest bookable stay clamped to the owner's maximum_nights cap.
      Materialized as a table like every other intermediate model — see
      dbt_project.yml.
    config:
      tags: ['1x_day']
    columns:
      - name: availability_window_id
        description: "{{ doc('availability_window_id') }}"
        data_tests:
          - unique
          - not_null

      - name: listing_id
        description: "{{ doc('listing_id') }}"
        data_tests:
          - not_null

      - name: window_start_date
        description: "{{ doc('window_start_date') }}"
        data_tests:
          - not_null

      - name: window_end_date
        description: "{{ doc('window_end_date') }}"
        data_tests:
          - not_null

      - name: window_length_nights
        description: "{{ doc('window_length_nights') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

      - name: minimum_nights
        description: "{{ doc('minimum_nights') }}"

      - name: maximum_nights
        description: "{{ doc('maximum_nights') }}"

      - name: longest_possible_stay_nights
        description: "{{ doc('longest_possible_stay_nights') }}"
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              longest_possible_stay_nights <= window_length_nights
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              window_end_date >= window_start_date
