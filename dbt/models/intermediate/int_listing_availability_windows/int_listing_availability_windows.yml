version: 2

models:
  - name: int_listing_availability_windows
    description: >
      One row per contiguous window of available dates per listing, with the
      longest bookable stay clamped to the owner's maximum_nights cap.
      Materialized as a table like every other intermediate model — see
      dbt_project.yml.
    columns:
      - name: availability_window_id
        description: Surrogate key over (listing_id, island_group).
        data_tests:
          - unique
          - not_null
      - name: listing_id
        description: Listing the window belongs to.
        data_tests:
          - not_null
      - name: window_start_date
        description: First available date in the window.
        data_tests:
          - not_null
      - name: window_end_date
        description: Last available date in the window.
        data_tests:
          - not_null
      - name: window_length_nights
        description: >
          Count of available dates in the window — a count of rows, not
          datediff(window_start_date, window_end_date), which would be one
          lower. Every available calendar date is treated as a bookable night.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: longest_possible_stay_nights
        description: >
          least(window_length_nights, maximum_nights). Both constraints bind in
          real data: for listing 1303261 the window binds (159-night window
          under a 180-night cap), while for listing 743211 the owner's cap binds
          (206-night window capped to 90). The cap binds in 8 of 204 windows.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              longest_possible_stay_nights <= window_length_nights
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              window_end_date >= window_start_date
