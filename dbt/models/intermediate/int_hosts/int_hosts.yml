version: 2

models:
  - name: int_hosts
    description: >
      One row per host, reconstructed by grouping int_listings on host_id since
      hosts do not arrive as their own source. Portfolio size, tenure inputs, and
      performance rolled up from the host's listings.
    config:
      tags: ['1x_day']
    columns:
      - name: host_id
        description: >
          {{ doc('host_id') }}

          Primary key here. One row per host across the non-orphan listings.
        data_tests:
          - not_null

      - name: host_name_masked
        description: "{{ doc('host_name_masked') }}"

      - name: host_since
        description: "{{ doc('host_since') }}"

      - name: host_location
        description: "{{ doc('host_location') }}"

      - name: verification_count
        description: "{{ doc('verification_count') }}"

      - name: verification_list
        description: "{{ doc('verification_list') }}"

      - name: is_verified_email
        description: "{{ doc('is_verified_email') }}"

      - name: is_verified_phone
        description: "{{ doc('is_verified_phone') }}"

      - name: is_verified_government_id
        description: "{{ doc('is_verified_government_id') }}"

      - name: is_verified_offline_government_id
        description: "{{ doc('is_verified_offline_government_id') }}"

      - name: is_verified_reviews
        description: >
          Whether the host has been verified by platform reviews. Generated
          flag.

      - name: is_verified_kba
        description: >
          Whether the host completed knowledge-based authentication. Generated
          flag.

      - name: is_verified_jumio
        description: >
          Whether the host was verified through Jumio, a third-party ID vendor.
          Generated flag.

      - name: is_verified_facebook
        description: >
          Whether the host linked a Facebook account. A social signal rather
          than an identity check. Generated flag.

      - name: is_verified_selfie
        description: >
          Whether the host submitted a selfie match. Generated flag.

      - name: is_verified_identity_manual
        description: >
          Whether the host was verified by manual review. Generated flag.

      - name: is_verified_work_email
        description: >
          Whether the host verified a work email address. Distinct from
          is_verified_email, which every host has. Generated flag.

      - name: listing_count
        description: "{{ doc('listing_count') }}"

      - name: calendar_days
        description: >
          Total calendar days across all the host's listings — the denominator
          of occupancy_rate.

      - name: booked_nights
        description: Total booked nights across all the host's listings.

      - name: total_revenue
        description: "{{ doc('host_total_revenue') }}"

      - name: reservations
        description: >
          Total reservations across all the host's listings. Includes
          snapshot-edge-censored reservations, which really happened.

      - name: occupancy_rate
        description: "{{ doc('host_occupancy_rate') }}"

      - name: avg_nights_per_stay
        description: "{{ doc('host_avg_nights_per_stay') }}"

      - name: avg_list_price
        description: >
          Average advertised nightly rate across the host's listings,
          unweighted — this describes the host's pricing, not achieved revenue.

      - name: total_reviews
        description: Lifetime review count summed across the host's listings.

      - name: avg_review_score
        description: >
          Unweighted average of the host's listing review scores. Listings with
          no score drop out rather than counting as zero, so this is NULL only
          when none of the host's listings have been reviewed.
