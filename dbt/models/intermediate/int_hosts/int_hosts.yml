version: 2

models:
  - name: int_hosts
    description: >
      One row per host, reconstructed by grouping stg_listings on host_id since
      hosts do not arrive as their own source. Portfolio size, tenure inputs, and
      performance rolled up from the host's listings. Materialized as a table
      like every other intermediate model — see dbt_project.yml.

      Excludes orphan listing 276450, which has no listings row and therefore no
      host_id.
    config:
      tags: ['1x_day']
    columns:
      - name: host_id
        description: >
          {{ doc('host_id') }}

          Primary key here. 36 hosts across 49 listings.
        data_tests:
          # No unique: the hosts CTE is `group by all` on this column, so
          # uniqueness is structural. not_null still earns its place — it is what
          # catches a listing arriving without a host_id.
          - not_null

      - name: host_name_masked
        description: "{{ doc('host_name_masked') }}"

      - name: host_since
        description: "{{ doc('host_since') }}"

      - name: host_location
        description: "{{ doc('host_location') }}"

      - name: verification_count
        description: "{{ doc('verification_count') }}"
        data_tests:
          # not_null is the tripwire for the left join dropping a host: NULL here
          # means that host has no rows in int_host_verifications at all, i.e. an
          # empty or unparseable array. Every host has at least email and phone
          # today, so this failing is real news.
          #
          # No accepted_range(min 1) alongside it: this is count(*) within a
          # group, so once not_null passes the value is necessarily >= 1.
          - not_null

      - name: verification_list
        description: "{{ doc('verification_list') }}"

      # The is_verified_* flags are generated by a Jinja loop over the methods in
      # the source, so this list is not exhaustive by construction. Documented
      # here are the ones with analytical or data-quality intent; the rest follow
      # the same is_verified_<slugified_method> pattern.
      #
      # dbt run-operation generate_verification_flag_yml
      # emits the missing entries and reports any declared here that the data no
      # longer produces.
      - name: is_verified_email
        description: "{{ doc('is_verified_email') }}"

      - name: is_verified_phone
        description: "{{ doc('is_verified_phone') }}"

      - name: is_verified_government_id
        description: "{{ doc('is_verified_government_id') }}"

      - name: is_verified_offline_government_id
        description: "{{ doc('is_verified_offline_government_id') }}"

      - name: is_verified_reviews
        description: >
          Whether the host has been verified by platform reviews — 34 of 36
          hosts. Generated flag.

      - name: is_verified_kba
        description: >
          Whether the host completed knowledge-based authentication — 18 of 36
          hosts. Generated flag.

      - name: is_verified_jumio
        description: >
          Whether the host was verified through Jumio, a third-party ID
          vendor — 10 of 36 hosts. Generated flag.

      - name: is_verified_facebook
        description: >
          Whether the host linked a Facebook account — 10 of 36 hosts. A social
          signal rather than an identity check. Generated flag.

      - name: is_verified_selfie
        description: >
          Whether the host submitted a selfie match — 5 of 36 hosts. Generated
          flag.

      - name: is_verified_identity_manual
        description: >
          Whether the host was verified by manual review — 4 of 36 hosts.
          Generated flag.

      - name: is_verified_work_email
        description: >
          Whether the host verified a work email address — 4 of 36 hosts.
          Distinct from is_verified_email, which every host has. Generated flag.

      # No tests on the rolled-up measures below. Every one is an aggregate over
      # a non-empty group of non-NULL inputs, so none of them can be NULL and
      # none can leave its plausible range:
      #
      #   listing_count    count(*) within the group — always >= 1
      #   calendar_days    sum() over a coalesce(..., 0)
      #   booked_nights    sum() over a coalesce(..., 0)
      #   total_revenue    sum() over a coalesce(..., 0)
      #   reservations     sum() over a coalesce(..., 0)
      #   occupancy_rate   div0() of the two sums above, so 0-1 is structural
      #                    (booked_nights is count_if over the same rows
      #                    calendar_days counts)
      #
      # The measures that CAN be NULL — avg_nights_per_stay, avg_review_score —
      # are deliberately untested, because NULL is the correct answer for a host
      # with no completed stays or no reviews.
      - name: listing_count
        description: "{{ doc('listing_count') }}"

      - name: calendar_days
        description: >
          Total calendar days across all the host's listings — the denominator
          of occupancy_rate.

      - name: booked_nights
        description: Total booked nights across all the host's listings.

      - name: total_revenue
        description: "{{ doc('host_total_revenue') }}"

      - name: reservations
        description: >
          Total reservations across all the host's listings. Includes
          snapshot-edge-censored reservations, which really happened.

      - name: occupancy_rate
        description: "{{ doc('host_occupancy_rate') }}"

      - name: avg_nights_per_stay
        description: "{{ doc('host_avg_nights_per_stay') }}"

      - name: avg_list_price
        description: >
          Average advertised nightly rate across the host's listings,
          unweighted — this describes the host's pricing, not achieved revenue.

      - name: total_reviews
        description: Lifetime review count summed across the host's listings.

      - name: avg_review_score
        description: >
          Unweighted average of the host's listing review scores. Listings with
          no score drop out rather than counting as zero, so this is NULL only
          when none of the host's listings have been reviewed.

    # No model-level tests. booked_nights <= calendar_days was the obvious
    # candidate, but booked_nights is sum(count_if(not is_available)) and
    # calendar_days is sum(count(*)) over the same rows — a count of a subset
    # against a count of the whole, which cannot exceed it. The assertion that
    # actually protects these numbers is stg_calendar.is_available's not_null,
    # since a NULL there is what would make count_if silently undercount.
