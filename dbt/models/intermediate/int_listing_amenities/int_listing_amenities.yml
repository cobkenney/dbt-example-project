version: 2

models:
  - name: int_listing_amenities
    description: >
      One row per listing per amenity — the bridge grain, flattened out of the
      JSON array on the changelog's latest event per listing. The amenity
      vocabulary is enumerated in seeds/known_amenity_names.csv.


      Just the flatten: the boolean pivot lives in int_listing_daily, where the
      flags are consumed. Same split as int_host_verifications, which flattens
      verifications and leaves the is_verified_* pivot to int_hosts. That is what
      keeps the generated one-column-per-amenity surface out of this model and
      out of anything that only needs to know which amenities a listing has.


      Holds the CURRENT amenity set, a deliberate grain reduction rather than
      history. The changelog does hold real history — most listings have events
      with differing amenity sets — but every event predates the calendar
      window, so a point-in-time join provably changes nothing — see
      tests/assert_amenities_predate_calendar.sql, which fails if that stops
      being true.


      Covers every listing the calendar references, including the orphans
      stg_listings lacks — the changelog is the driving table for exactly that
      reason.
    config:
      tags: ['1x_day']
    columns:
      - name: listing_id
        description: >
          {{ doc('listing_id') }}

          Not unique here — this is a bridge, one row per amenity per listing.
        data_tests:
          - not_null

      - name: amenity_name
        description: >
          The amenity as it appears in the source array, unmodified — including
          the Unicode apostrophes in names like "Children’s books and toys".
          amenity_flag_name() is what slugifies these into column names for the
          pivot in int_listing_daily.
        data_tests:
          - not_null

          # Warns when the source produces an amenity this project has not seen.
          # The known list is a SEED, seeds/known_amenity_names.csv, rather than a
          # wall of literal values inline — see seeds/_seeds.yml for why, and for
          # the cost.
          #
          # relationships, not accepted_values, because accepted_values takes a
          # literal list and cannot read a table. Same semantics here: every
          # amenity_name must appear in the seed, and the test returns the ones
          # that do not.
          #
          # WARN, not error. A new amenity upstream is a source change, not a
          # defect, so failing the build over it would be wrong — but saying
          # nothing would mean int_listing_daily silently grows another flag column
          # that no yml documents and no mart carries.
          #
          # The warning is a WORK ORDER, not a defect report:
          #   1. dbt run-operation generate_amenity_flag_yml
          #      -> paste the new flag into int_listing_daily.yml
          #   2. decide whether it belongs in fct_listing_daily or dim_listings
          #   3. dbt --quiet run-operation generate_known_amenity_names_seed \
          #        > seeds/known_amenity_names.csv
          # Step 3 LAST. It reads the current data, so running it first makes this
          # test pass by definition and turns the tripwire off silently.
          #
          # This catches the direction the codegen loop cannot. The loop emits a
          # column for whatever it finds, so a REMOVED amenity leaves a stale
          # column that generate_amenity_flag_yml reports — but a NEW one just
          # widens the model on the next run, invisibly, which is the note already
          # made in int_listing_daily.sql.
          - relationships:
              name: warn_new_amenity_name
              arguments:
                to: ref('known_amenity_names')
                field: amenity_name
              config:
                severity: warn

    # No grain test on (listing_id, amenity_name): the model's final statement is
    # `select distinct listing_id, amenity_name`, so the grain is enforced by the
    # SQL rather than asserted after the fact. Same reasoning as
    # int_host_verifications.
    #
    # No rowcount test against stg_amenities_changelog — this is a bridge, so the
    # rowcount is a multiple of the listing count and not a fixed figure. The
    # condition worth watching is a listing reaching zero rows here, which would
    # silently drop its flags to NULL downstream;
    # int_listing_daily.amenity_count's not_null catches that.
