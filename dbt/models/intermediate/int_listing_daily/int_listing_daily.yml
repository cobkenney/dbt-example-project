version: 2

models:
  - name: int_listing_daily
    description: >
      One row per listing per date, joining calendar to listing attributes and
      amenity flags. The daily grain every mart aggregates from. Left joins
      preserve the orphan listings' calendar rows, which carry real booked
      revenue that an inner join would silently drop.
    config:
      tags: ['1x_day']
    columns:
      - name: calendar_id
        description: "{{ doc('calendar_id') }}"
        data_tests:
          # No not_null: this is stg_calendar's surrogate key passed through, and
          # generate_surrogate_key cannot emit NULL.
          #
          # unique is doing real work despite being tested upstream too. This
          # model left joins stg_listings and the amenity pivot, so a
          # duplicate key here means one of those join keys stopped being unique
          # and the daily grain fanned out.
          - unique

      - name: listing_id
        description: "{{ doc('listing_id') }}"
        data_tests:
          - not_null

      - name: calendar_date
        description: "{{ doc('calendar_date') }}"
        data_tests:
          - not_null

      - name: is_available
        description: "{{ doc('is_available') }}"
        data_tests:
          - not_null

      - name: reservation_id
        description: "{{ doc('reservation_id') }}"

      - name: price
        description: "{{ doc('nightly_price') }}"
        data_tests:
          - not_null

      - name: revenue
        description: "{{ doc('revenue') }}"

      - name: minimum_nights
        description: "{{ doc('minimum_nights') }}"

      - name: maximum_nights
        description: "{{ doc('maximum_nights') }}"

      # No not_null on either: both are built with case expressions that always
      # return a value, and the running sum is over a non-null integer.
      - name: is_window_start
        description: "{{ doc('is_window_start') }}"

      - name: availability_window_seq
        description: "{{ doc('availability_window_seq') }}"
        data_tests:
          # At least 1 on every row once a listing's first available night has
          # passed, and 0 only on booked nights preceding it. Negative or NULL
          # would mean the running sum broke.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      # not_null is meaningful here now, which it was not before. This column
      # used to be computed in place as `listings.listing_id is null` — an IS
      # NULL comparison returns true or false and never NULL, so the test could
      # not fail. It is now read across a left join to int_listings, so a NULL
      # means a calendar row whose listing is absent from int_listings: the
      # calendar has grown a listing the amenities bridge does not cover, and
      # the model has quietly stopped knowing whether it is an orphan.
      #
      # Models downstream carry the column forward without a join, so they need
      # no test of their own — this is the one place it can go NULL.
      - name: is_orphan_listing
        description: "{{ doc('is_orphan_listing') }}"
        data_tests:
          - not_null

      - name: listing_name
        description: "{{ doc('listing_name') }}"

      - name: neighborhood
        description: "{{ doc('neighborhood') }}"

      - name: property_type
        description: "{{ doc('property_type') }}"

      - name: room_type
        description: "{{ doc('room_type') }}"

      - name: accommodates
        description: "{{ doc('accommodates') }}"

      - name: bedrooms
        description: "{{ doc('bedrooms') }}"

      - name: beds
        description: "{{ doc('beds') }}"

      - name: host_id
        description: "{{ doc('host_id') }}"

      - name: amenity_count
        description: >
          {{ doc('amenity_count') }}

          not_null is the tripwire for the amenities left join missing a listing:
          the bridge covers every listing the calendar references today, and a
          NULL here means one stopped appearing in the changelog. That is also
          what would silently turn every flag below NULL.
        data_tests:
          - not_null

      - name: amenity_list
        description: >
          Array of all distinct amenity names for the listing. Redundant with the
          flags for filtering — kept because it survives the addition of new
          amenity names without a schema change, which the generated columns do
          not.

      # The generated amenity flags. The loop that builds them lives in this
      # model's .sql; this list is maintained by
      #
      #   dbt run-operation generate_amenity_flag_yml
      #
      # which emits any flag the data produces but the yml has not declared, and
      # names any declared flag the data no longer produces.
      #
      # Only the six the marts expose carry curated descriptions from docs.md;
      # the rest follow the same has_<slugified_amenity_name> pattern. Because the
      # column list comes from the data, a new amenity upstream adds a column on
      # the next run — which is why the marts downstream name the flags they
      # carry instead of selecting them in bulk.
      #
      # No not_null tests on the flags. boolor_agg over a non-empty group returns
      # true or false, so a NULL can only come from the left join missing the
      # listing entirely — the single condition amenity_count's not_null above
      # already catches, once, instead of 81 times.
      - name: has_air_conditioning
        description: "{{ doc('has_air_conditioning') }}"

      - name: has_lockbox
        description: "{{ doc('has_lockbox') }}"

      - name: has_first_aid_kit
        description: "{{ doc('has_first_aid_kit') }}"

      - name: has_wifi
        description: "{{ doc('has_wifi') }}"

      - name: has_heating
