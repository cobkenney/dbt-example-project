    data_tests:
      # The fan-out guard, and the reason it works: this equality holds only
      # because stg_listings.listing_id and the amenity pivot's listing_id are
      # each unique. If either stops being, the left joins multiply rows and the
      # count diverges from the calendar it was built from.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_calendar')

      # No grain test on (listing_id, calendar_date) — calendar_id is the hash of
      # exactly that pair, so `unique` on it above asserts the same fact.
      #
      # No expression test on revenue. It was
      #   (is_available and revenue is null) or (not is_available and revenue is
      #   not null)
      # which restates revenue's own definition — `case when not is_available
      # then price end` — given price and is_available are both not_null. Those
      # two tests are what actually hold the invariant up.
