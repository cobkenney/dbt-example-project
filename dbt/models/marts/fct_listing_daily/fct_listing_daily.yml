version: 2

models:
  - name: fct_listing_daily
    description: >
      One row per listing per date — the atomic fact table for revenue and
      pricing analysis. Retains the 365 orphan rows, which carry $2,200 of
      booked revenue; excluding them shifts the July 2022 no-AC revenue share
      from 21.2% to 22.1%.
    columns:
      - name: calendar_id
        description: Primary key, inherited from stg_calendar.
        data_tests:
          - unique
          - not_null
      - name: listing_id
        description: Listing the date belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id
      - name: calendar_date
        description: Date the row describes.
        data_tests:
          - not_null
      - name: month_start_date
        description: First day of the month, precomputed for monthly rollups.
        data_tests:
          - not_null
      - name: price
        description: Nightly price in dollars.
        data_tests:
          - not_null
      - name: revenue
        description: >
          price on booked nights, NULL otherwise — so sum(revenue) needs no
          filtering.
      - name: is_available
        description: True when the listing is bookable on this date.
        data_tests:
          - not_null
      - name: has_air_conditioning
        description: Whether the listing offers air conditioning.
        data_tests:
          - not_null
      - name: is_orphan_listing
        description: True for rows whose listing is missing from the raw listings table.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, calendar_date]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_listing_daily')
