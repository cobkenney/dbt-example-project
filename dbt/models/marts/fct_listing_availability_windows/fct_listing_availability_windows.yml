version: 2

models:
  - name: fct_listing_availability_windows
    description: >
      One row per contiguous availability window per listing, with amenity
      flags for filtering. Answers "what is the longest possible stay for
      listings with amenity X".
    columns:
      - name: availability_window_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: listing_id
        description: Listing the window belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id
      - name: window_start_date
        description: First available date in the window.
        data_tests:
          - not_null
      - name: window_end_date
        description: Last available date in the window.
        data_tests:
          - not_null
      - name: window_length_nights
        description: >
          Consecutive available dates in the window, counted as rows rather
          than datediff(window_start_date, window_end_date) — which would be one
          lower. Every available calendar date counts as a bookable night.
        data_tests:
          - not_null
      - name: longest_possible_stay_nights
        description: >
          least(window_length_nights, maximum_nights). Both constraints bind in
          real data: listing 1303261 peaks at 159 nights where the window binds
          under a 180-night cap, while listing 743211 has a 206-night window
          capped to 90. The owner's cap binds in 8 of 204 windows.
        data_tests:
          - not_null
      - name: is_bookable_window
        description: >
          False when the window is shorter than the owner's minimum_nights, so
          no stay could actually be booked in it.
        data_tests:
          - not_null
      - name: has_lockbox
        description: Whether the listing offers a lockbox.
        data_tests:
          - not_null
      - name: has_first_aid_kit
        description: Whether the listing offers a first aid kit.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              longest_possible_stay_nights <= window_length_nights
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_listing_availability_windows')
