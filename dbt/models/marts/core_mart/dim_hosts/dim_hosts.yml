version: 2

models:
  - name: dim_hosts
    description: >
      One row per host: portfolio size, tenure, and performance.
    config:
      tags: ['1x_day']
    columns:
      - name: host_id
        description: >
          {{ doc('host_id') }}

          Primary key here.
        data_tests:
          - unique
          - not_null

      - name: host_name_masked
        description: "{{ doc('host_name_masked') }}"

      - name: host_since
        description: "{{ doc('host_since') }}"

      - name: as_of_date
        description: >
          {{ doc('as_of_date') }}

          Here it is the reference point for host_tenure_years.

      - name: host_tenure_years
        description: >
          Whole years between host_since and as_of_date. Measured against the
          snapshot's end rather than current_date, so the value is stable across
          runs.
        data_tests:
          - not_null

      - name: host_location
        description: "{{ doc('host_location') }}"

      - name: verification_count
        description: "{{ doc('verification_count') }}"

      - name: verification_list
        description: "{{ doc('verification_list') }}"

      - name: is_verified_email
        description: "{{ doc('is_verified_email') }}"

      - name: is_verified_phone
        description: "{{ doc('is_verified_phone') }}"

      - name: is_verified_reviews
        description: >
          Whether the host has been verified by platform reviews. The most
          discriminating of the common methods.

      - name: is_verified_kba
        description: >
          Whether the host completed knowledge-based authentication.

      - name: is_verified_government_id
        description: "{{ doc('is_verified_government_id') }}"

      - name: is_verified_offline_government_id
        description: "{{ doc('is_verified_offline_government_id') }}"

      - name: is_verified_jumio
        description: >
          Whether the host was verified through Jumio, a third-party ID vendor.

      - name: is_verified_facebook
        description: >
          Whether the host linked a Facebook account. A social signal, not an
          identity check.

      - name: is_verified_selfie
        description: Whether the host submitted a selfie match.

      - name: is_verified_identity_manual
        description: >
          Whether the host was verified by manual review.

      - name: is_verified_work_email
        description: >
          Whether the host verified a work email address. Distinct from
          is_verified_email, which every host has.

      - name: listing_count
        description: "{{ doc('listing_count') }}"

      - name: is_multi_listing_host
        description: >
          True where the host holds more than one listing. The segmentation for
          professional-operator vs casual-host questions, since the two are
          different business relationships with different economics.

      - name: calendar_days
        description: Total calendar days across all the host's listings.

      - name: booked_nights
        description: Total booked nights across all the host's listings.

      - name: total_revenue
        description: "{{ doc('host_total_revenue') }}"

      - name: reservations
        description: Total reservations across all the host's listings.

      - name: occupancy_rate
        description: >
          {{ doc('host_occupancy_rate') }}

      - name: avg_nights_per_stay
        description: "{{ doc('host_avg_nights_per_stay') }}"

      - name: avg_list_price
        description: >
          Average advertised nightly rate across the host's listings. Describes
          pricing, not achieved revenue.

      - name: revenue_per_listing
        description: >
          total_revenue / listing_count — the measure that makes hosts comparable
          across portfolio sizes.

          Compare hosts on this rather than total_revenue, which a 5-listing host
          wins by construction.

      - name: total_reviews
        description: Lifetime review count summed across the host's listings.

      - name: avg_review_score
        description: >
          Unweighted average of the host's listing review scores. NULL only when
          none of the host's listings have been reviewed.
