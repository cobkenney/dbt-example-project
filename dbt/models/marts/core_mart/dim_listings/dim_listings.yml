version: 2

models:
  - name: dim_listings
    description: >
      One row per listing with descriptive attributes, amenity flags, and
      lifetime performance measures. Includes listings from calendar source
      that may have been hard deleted from listings source
      (is_orphan_listing = TRUE).
    config:
      tags: ['1x_day']
    columns:
      - name: listing_id
        description: >
          {{ doc('listing_id') }}

          Primary key here.
        data_tests:
          - unique
          - not_null

      - name: listing_name
        description: "{{ doc('listing_name') }}"

      - name: neighborhood
        description: "{{ doc('neighborhood') }}"

      - name: property_type
        description: "{{ doc('property_type') }}"

      - name: room_type
        description: "{{ doc('room_type') }}"

      - name: accommodates
        description: "{{ doc('accommodates') }}"

      - name: bedrooms
        description: "{{ doc('bedrooms') }}"

      - name: beds
        description: "{{ doc('beds') }}"

      - name: bathrooms
        description: >
          Numeric bathroom count parsed from the raw free-text label, ranging
          1.0-2.5. Does not indicate whether the bathroom is shared — see
          `is_shared_bathroom`.

      - name: is_shared_bathroom
        description: >
          True when the raw bathroom label mentions "shared". Not reflected in
          the `bathrooms` count, so this is the only signal for it.

      - name: number_of_reviews
        description: Lifetime review count. Zero for listings that have never been reviewed.

      - name: review_scores_rating
        description: Average review score. NULL for listings with no reviews.

      - name: first_review_date
        description: Date of the earliest review. NULL for listings with no reviews.

      - name: last_review_date
        description: Date of the most recent review. NULL for listings with no reviews.

      - name: as_of_date
        description: >
          {{ doc('as_of_date') }}

          Present on this model so review recency can be measured without
          reaching through host_id — the orphan listing has none. Not compared
          against anything here; the query picks the unit.

          No not_null: this can only be NULL if int_listing_daily is empty, which
          booked_nights' not_null below already catches.

      - name: host_id
        description: "{{ doc('host_id') }}"

      - name: host_name_masked
        description: >
          {{ doc('host_name_masked') }}

          NULL for the orphan listing, which has no listings row at all.

      - name: host_since
        description: Date the host joined the platform. NULL for the orphan listing.

      - name: host_location
        description: >
          Self-reported host location, free text and not normalized. Not
          comparable to `neighborhood`, which describes the listing. NULL for
          the orphan listing.

      - name: list_price
        description: >
          Host's advertised nightly rate from the listings table.

          This is the list price, not what was actually charged or earned — see
          `avg_nightly_price` for the calendar-based rate and `total_revenue`
          for realized revenue. NULL for the orphan listing.

      - name: amenity_count
        description: "{{ doc('amenity_count') }}"

      - name: has_air_conditioning
        description: "{{ doc('has_air_conditioning') }}"
        data_tests:
          - not_null

      - name: has_lockbox
        description: "{{ doc('has_lockbox') }}"
        data_tests:
          - not_null

      - name: has_first_aid_kit
        description: "{{ doc('has_first_aid_kit') }}"
        data_tests:
          - not_null

      - name: has_wifi
        description: "{{ doc('has_wifi') }}"

      - name: has_heating
        description: "{{ doc('has_heating') }}"

      - name: has_kitchen
        description: "{{ doc('has_kitchen') }}"

      - name: calendar_days
        description: >
          Days the listing appears in the calendar. 365 for every listing, since
          the source is a fixed one-year snapshot — so it is the denominator of
          `occupancy_rate` rather than a measure of listing age.

      - name: booked_nights
        description: Nights booked across the calendar window.
        data_tests:
          - not_null

      - name: available_nights
        description: >
          Nights still available across the calendar window. Together with
          `booked_nights` this sums to `calendar_days`, which the model-level
          test asserts.

      - name: total_revenue
        description: >
          Sum of nightly price across booked nights.

          Zero, not NULL, for the 3 listings that were never booked — `sum()`
          over all-NULL revenue returns NULL, which is coalesced to 0 as the
          honest measure.
        data_tests:
          - not_null

      - name: avg_nightly_price
        description: >
          Mean nightly price across all calendar dates, booked or not. This is
          the rate the listing was offered at, not the rate it achieved — divide
          `total_revenue` by `booked_nights` for that.

      - name: min_nightly_price
        description: Lowest nightly price across the calendar window.

      - name: max_nightly_price
        description: Highest nightly price across the calendar window.

      - name: occupancy_rate
        description: >
          booked_nights / calendar_days, using div0 so a listing with no
          calendar rows yields 0 rather than erroring. Ranges 0-1.

          No accepted_range: booked_nights is count_if over the rows
          calendar_days counts, so the ratio cannot leave 0-1. not_null is kept —
          div0 returns NULL when its inputs are NULL, which is what the
          daily_rollup left join would produce.
        data_tests:
          - not_null

      - name: is_orphan_listing
        description: "{{ doc('is_orphan_listing') }}"
    data_tests:
      # The reconciliation worth keeping. booked_nights and available_nights are
      # counted independently with count_if, so this catches a NULL is_available
      # in the calendar — where both count_if predicates go NULL, the row falls
      # out of both counts, and the sum stops matching count(*).
      #
      # It does NOT cover a NULL calendar_days from the daily_rollup left join:
      # the test compiles to `where not (expression)`, and not(NULL) is NULL, so
      # a NULL row passes silently. booked_nights' not_null is what catches that
      # join missing.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              booked_nights + available_nights = calendar_days
