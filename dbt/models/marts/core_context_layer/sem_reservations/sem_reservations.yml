version: 2

models:
  - name: sem_reservations
    description: >
      Snowflake semantic view over `fct_reservations`: booking volume, length of
      stay, and booking value at one row per reservation.

      Separate from `sem_listing_daily` because the grains differ — one row per
      reservation here against one row per listing-night there — and a single
      view holding both would let a booking be counted once per night it
      occupies.

      The `avg_length_of_stay` metric excludes the censored reservations by
      construction, which is the one thing most likely to be got wrong by hand.

      Descriptions here do not reach Snowflake; the `COMMENT` clauses in the DDL
      do. See `sem_listing_daily.yml` for why there are no column docs, and why
      `verified_queries_run` is the one test these views carry.
    config:
      tags: ['1x_day']

    data_tests:
      - verified_queries_run:
          arguments:
            question: q17
      - verified_queries_run:
          arguments:
            question: q22
      - verified_queries_run:
          arguments:
            question: q23
